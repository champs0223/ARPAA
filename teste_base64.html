<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Upload Base64</title>
</head>
<body>
    <h1>Teste de Upload de Foto (Base64)</h1>

    <form onsubmit="salvarAnimal(); return false;">
        <input type="text" id="nome" placeholder="Nome do animal" required><br><br>
        <input type="file" id="foto" accept="image/*" required><br><br>
        <button type="submit">Salvar Animal</button>
    </form>

    <h2>Animais Salvos:</h2>
    <div id="lista"></div>

    <script>
        function salvarAnimal() {
            let nome = document.getElementById("nome").value;
            let arquivo = document.getElementById("foto").files[0];

            if (!arquivo) {
                alert("Selecione uma foto!");
                return;
            }

            let reader = new FileReader();
            reader.onload = function(e) {
                let fotoBase64 = e.target.result;

                let animal = {
                    id: Date.now(),
                    nome: nome,
                    foto: fotoBase64
                };

                let animais = JSON.parse(localStorage.getItem("animais")) || [];
                animais.push(animal);
                localStorage.setItem("animais", JSON.stringify(animais));

                mostrarAnimais();
                document.getElementById("nome").value = "";
                document.getElementById("foto").value = "";
                alert("Animal salvo com foto em base64!");
            };

            reader.readAsDataURL(arquivo);
        }

        function mostrarAnimais() {
            let animais = JSON.parse(localStorage.getItem("animais")) || [];
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            animais.forEach(animal => {
                lista.innerHTML += `
                    <div style="border: 1px solid #ccc; margin: 10px; padding: 10px;">
                        <h3>${animal.nome}</h3>
                        <img src="${animal.foto}" style="max-width: 200px; max-height: 200px;">
                    </div>
                `;
            });
        }

        // Mostrar animais ao carregar a página
        mostrarAnimais();
    </script>
</body>
</html>
