<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ARPAA Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
  background: linear-gradient(135deg, #0d9488 0%, #14b8a6 100%);
  min-height: 100vh;
}

.login-card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
</style>

</head>

<body class="flex items-center justify-center p-4">

<div class="login-card rounded-2xl shadow-2xl p-8 w-full max-w-md">

<!-- LOGO E TÍTULO -->
<div class="text-center mb-8">
  <div class="inline-flex items-center justify-center w-16 h-16 bg-teal-600 rounded-full mb-4">
    <i class="fas fa-paw text-white text-2xl"></i>
  </div>
  <h1 class="text-3xl font-bold text-gray-800 mb-2">ARPAA</h1>
  <p class="text-gray-600">Painel Administrativo</p>
</div>

<!-- FORMULÁRIO DE LOGIN -->
<form onsubmit="fazerLogin(); return false;" class="space-y-6">

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      <i class="fas fa-user mr-2"></i>Usuário
    </label>
    <input
      type="text"
      id="usuario"
      placeholder="Digite seu usuário"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent transition"
      required
    >
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      <i class="fas fa-lock mr-2"></i>Senha
    </label>
    <input
      type="password"
      id="senha"
      placeholder="Digite sua senha"
      class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent transition"
      required
    >
  </div>

  <button
    type="submit"
    class="w-full bg-teal-600 text-white py-3 px-4 rounded-lg hover:bg-teal-700 focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 transition font-semibold"
  >
    <i class="fas fa-sign-in-alt mr-2"></i>Entrar
  </button>

</form>

<!-- MENSAGEM DE ERRO -->
<div id="erro" class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg hidden">
  <i class="fas fa-exclamation-triangle mr-2"></i>
  <span id="erroTexto"></span>
</div>

<!-- LINK PARA SITE PRINCIPAL -->
<div class="text-center mt-6">
  <a href="../public/index.html" class="text-teal-600 hover:text-teal-800 text-sm">
    <i class="fas fa-arrow-left mr-1"></i>Voltar ao site
  </a>
</div>

</div>

<script>
// Verificar se já está logado
// Não redirecionar automaticamente para permitir re-login e evitar pular a tela de login.
// Se o usuário já estiver logado, ele pode entrar novamente normalmente.
if(localStorage.getItem("adminLogado") === "true"){
  console.log('Admin já logado. Mantendo na tela de login.');
}

function fazerLogin(){
  let usuario = document.getElementById("usuario").value
  let senha = document.getElementById("senha").value

  // Credenciais padrão (você pode alterar)
  if(usuario === "admin" && senha === "admin123"){

    localStorage.setItem("adminLogado", "true")
    localStorage.setItem("usuario_id", "1") // ID do usuário logado

    // Redirecionar para dashboard
    window.location.href = "html/dashboard.html"

  }else{

    mostrarErro("Usuário ou senha incorretos")

  }
}

function mostrarErro(mensagem){
  let erroDiv = document.getElementById("erro")
  let erroTexto = document.getElementById("erroTexto")

  erroTexto.textContent = mensagem
  erroDiv.classList.remove("hidden")

  // Esconder erro após 3 segundos
  setTimeout(() => {
    erroDiv.classList.add("hidden")
  }, 3000)
}

// Permitir login com Enter
document.addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    fazerLogin()
  }
})
</script>

</body>
</html>
