<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | ARPAA</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="icon" type="image/png" href="../../icones/logo.png">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="../css/config.css">
<script src="../js/tailwindconfig.js"></script>
<script src="../js/config-api.js"></script>

</head>

<body class="text-gray-900 antialiased overflow-x-hidden">

<!-- NAVBAR -->
<header class="fixed w-full top-0 z-50 bg-white shadow-md">

<div class="w-full px-4 sm:px-6 lg:px-8">

<div class="flex justify-between items-center h-20 max-w-7xl mx-auto">

<a href="../../public/index.html" class="flex items-center space-x-3">

<img src="../../icones/logo.png" alt="ARPAA Logo" class="h-12 w-12 object-contain">

<div class="flex flex-col">
<span class="text-2xl font-bold leading-none">
<span style="color: #00989b;">A</span><span style="color: #4e5057;">R</span><span style="color: #f1a31b;">P</span><span style="color: #00989b;">A</span><span style="color: #4e5057;">A</span>
</span>
<small style="color: #4e5057;" class="text-xs font-semibold leading-tight">ASSOCIAÇÃO DE RESGATE, PROTEÇÃO E AMPARO ANIMAL</small>
</div>

</a>

<span class="text-gray-700 font-semibold">
Painel Administrativo
</span>

</div>
</div>
</header>


<!-- FUNDO IGUAL AO HERO DO SITE -->
<section class="min-h-screen flex items-center justify-center bg-gradient-to-r from-teal-700 via-teal-600 to-teal-500 pt-32 pb-20 px-6 relative overflow-hidden">

<!-- ELEMENTOS DECORATIVOS IGUAIS AO HERO -->
<div class="absolute -bottom-6 -right-6 w-40 h-40 bg-yellow-400 rounded-2xl opacity-80"></div>
<div class="absolute -top-6 -left-6 w-28 h-28 bg-teal-400 rounded-2xl opacity-80"></div>

<div class="max-w-md w-full relative z-10">

<!-- CARD LOGIN -->
<div class="bg-white rounded-2xl shadow-2xl p-10">

<h2 class="text-3xl font-bold text-center text-teal-600 mb-8">
Login do Administrador
</h2>

<form id="loginForm" class="space-y-5" onsubmit="login(event)">

<input
id="usuario"
name="usuario"
autocomplete="username"
type="text"
placeholder="Usuário"
class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500">


<div class="relative">

<input
id="senha"
name="senha"
autocomplete="current-password"
type="password"
placeholder="Senha"
class="w-full border border-gray-300 p-3 rounded-lg pr-10 focus:outline-none focus:ring-2 focus:ring-teal-500">

<button
type="button"
onclick="mostrarSenha()"
class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700">

<i id="iconeSenha" class="fa-solid fa-eye"></i>

</button>

</div>


<button
type="submit"
class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold p-3 rounded-lg transition duration-200 shadow-md">

Entrar

</button>


<p id="erroLogin" class="text-red-600 text-sm text-center hidden">
Usuário ou senha incorretos
</p>

</form>

</div>

</div>

</section>


<script>

async function login(event){
  event.preventDefault()

  let usuario = document.getElementById("usuario").value
  let senha = document.getElementById("senha").value
  let erro = document.getElementById("erroLogin")

  if(!usuario || !senha){
    erro.textContent = "Preencha usuário e senha"
    erro.classList.remove("hidden")
    return
  }

  try {
    // Fazer login via API local ou remota
    let dados;
    
    if (USE_LOCAL_DB) {
      // Usar API local
      dados = await fazerLogin(usuario, senha);
    } else {
      // Usar API remota
      const response = await fetch(`${API_BASE_URL}/api/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ usuario, senha })
      });

      dados = await response.json();

      if(!response.ok){
        erro.textContent = dados.error || "Erro ao fazer login"
        erro.classList.remove("hidden")
        return
      }

      // Login bem-sucedido
      localStorage.setItem("adminLogado", "true")
      localStorage.setItem("usuarioId", dados.id)
      localStorage.setItem("usuarioNome", dados.nome)
      localStorage.setItem("usuarioAdmin", dados.is_admin ? "true" : "false")
      localStorage.setItem("adminToken", dados.token || "")
    }

    // Se chegou aqui, login foi bem-sucedido
    window.location.href="dashboard.html"

  } catch (error) {
    console.error('Erro:', error)
    erro.textContent = error.message || "Erro de conexão com o servidor"
    erro.classList.remove("hidden")
  }
}


function mostrarSenha(){

let campo = document.getElementById("senha")
let icone = document.getElementById("iconeSenha")

if(campo.type === "password"){

campo.type = "text"
icone.classList.remove("fa-eye")
icone.classList.add("fa-eye-slash")

}else{

campo.type = "password"
icone.classList.remove("fa-eye-slash")
icone.classList.add("fa-eye")

}

}


document.getElementById("usuario").addEventListener("input", limparErro)
document.getElementById("senha").addEventListener("input", limparErro)

function limparErro(){

document.getElementById("erroLogin").classList.add("hidden")

}

</script>

</body>
</html>
