<!-- CONTEÚDO -->

<!-- CARDS -->

  <!-- Pendentes -->

  <!-- Aprovadas -->

<!-- FILTRO -->

<button

</button>

<!-- TABELA -->

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
  <div class="bg-white p-6 rounded-xl w-full max-w-md">
    <h2 class="text-xl font-bold mb-4">Nova Adoção</h2>

    <!-- Animal primeiro -->
    <select id="animalSelect" class="w-full border p-2 rounded mb-3">
      <option value="">Selecione o animal</option>
    </select>

    <!-- Nome do adotante depois -->
    <input id="nome" placeholder="Nome do adotante" class="w-full border p-2 rounded mb-3">

    <input id="telefone" placeholder="(xx) xxxxx-xxxx" class="w-full border p-2 rounded mb-3"/>

<!-- Status da adoção -->
    <select id="statusAdocao" class="w-full border p-2 rounded mb-3">
  <option value="">Status da Adoção</option>
  <option value="pendente">Pendente</option>
  <option value="aprovado">Aprovado</option>
  <option value="recusado">Recusado</option>
</select>

    <div class="flex justify-end gap-2">
      <button onclick="fecharModal()" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
      <button onclick="salvarAdocao()" class="px-4 py-2 bg-teal-600 text-white rounded">Salvar</button>
    </div>
  </div>
</div>

<div id="modalAnimal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center">
  <div class="bg-white p-6 rounded-xl w-full max-w-lg">
    
    <h2 class="text-xl font-bold mb-4">Detalhes do Animal</h2>

    <div id="conteudoAnimal" class="space-y-2 text-gray-700"></div>

    <div class="flex justify-end mt-4">
      <button onclick="fecharModalAnimal()" class="px-4 py-2 bg-gray-300 rounded">
        Fechar
      </button>
    </div>

  </div>
</div>

<div id="modalConfirmar" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50">

  <div class="modal-box bg-white p-6 rounded-2xl shadow-xl w-80 text-center">

    <i class="fas fa-exclamation-triangle text-red-500 text-3xl mb-3"></i>

    <h2 class="text-lg font-bold mb-2">Tem certeza?</h2>

    <p id="textoConfirmacao" class="text-gray-600 mb-6"></p>

    <div class="flex justify-center gap-4">
      <button onclick="fecharModalConfirmar()" 
              class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition">
        Cancelar
      </button>

      <button id="btnConfirmarAcao"
              class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">
        Confirmar
      </button>
    </div>

  </div>
</div>

<div id="modalSucesso" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50">

  <div class="modal-box bg-white p-6 rounded-2xl shadow-xl w-80 text-center">

    <i class="fas fa-check-circle text-green-500 text-4xl mb-3"></i>

    <h2 class="text-green-600 text-xl font-bold mb-2">Sucesso</h2>

    <p id="mensagemSucesso" class="mb-6 text-gray-600"></p>

    <button onclick="fecharModalSucesso()" 
            class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg transition">
      OK
    </button>

  </div>
</div>

<script>
let adocoes = JSON.parse(localStorage.getItem("adocoes")) || []

function salvar(){
  localStorage.setItem("adocoes", JSON.stringify(adocoes))
}

function abrirModal(){
  document.getElementById("modal").classList.remove("hidden")
  document.getElementById("modal").classList.add("flex")

  // 🔥 limpar formulário
  document.getElementById("nome").value = ""
  document.getElementById("telefone").value = ""
  document.getElementById("animalSelect").value = ""
  document.getElementById("statusAdocao").value = ""

  // 🔥 resetar edição
  indexEditando = null

  // 🔥 recarregar animais disponíveis
  carregarAnimais()
}

function fecharModal(){
  document.getElementById("modal").classList.add("hidden")
}

function salvarAdocao(){

  let nome = document.getElementById("nome").value
  let animalId = Number(document.getElementById("animalSelect").value)
  let telefone = document.getElementById("telefone").value.replace(/\D/g, "")
  let status = document.getElementById("statusAdocao").value

let adotanteId = salvarAdotante(nome, telefone)

  let animais = JSON.parse(localStorage.getItem("animais")) || []
  let animalObj = animais.find(a => a.id == animalId)

  // validação
  if(!nome || !animalId || !telefone){
    mostrarSucesso("Preencha todos os campos")
    return
  }

  if(indexEditando !== null){
    adocoes[indexEditando] = {
      ...adocoes[indexEditando],
      nome,
      animalId,
      animalNome: animalObj.nome,
      telefone,
      status
    }
    alterarStatus(indexEditando, status)
    indexEditando = null
  } else {
    adocoes.push({
  adotanteId,
  nome,
  animalId,
  animalNome: animalObj.nome,
  telefone,
  data: new Date().toISOString(),
  status,
  contato: false
})
  }

  salvar()
  fecharModal()
  render()
  mostrarSucesso("Adoção salva com sucesso!")
}


function alterarStatus(index, status){
  // Atualiza o status da adoção
  adocoes[index].status = status

  // Pega a lista de animais do localStorage
  let animais = JSON.parse(localStorage.getItem("animais")) || []
  let animal = animais.find(a => a.id == adocoes[index].animalId)

  if(!animal) return // se não encontrar o animal, sai da função

  if(status === "pendente"){
    // processo em análise → animal reservado
    animal.status = "Reservado"
  } else if(status === "aprovado"){
    // adoção aprovada → animal adotado
    animal.status = "Adotado"
  } else if(status === "recusado"){
    // se não houver outra adoção pendente ou aprovada para esse animal
    let existePendenteOuAprovada = adocoes.some(a => 
      a.animalId == animal.id && (a.status === "pendente" || a.status === "aprovado")
    )
    if(!existePendenteOuAprovada){
      animal.status = "Disponível"
    }
  }

  // Salva as alterações no localStorage
  localStorage.setItem("animais", JSON.stringify(animais))
  salvar()
  render()
}

function excluir(index){
  abrirConfirmacao("Deseja excluir essa adoção?", () => {
    adocoes.splice(index, 1)
    salvar()
    render()
    mostrarSucesso("Adoção excluída com sucesso!")
  })
}

function render(){
  adocoes.forEach(a => {
  if(a.contato === undefined){
    a.contato = false
  }
})
    let lista = document.getElementById("listaAdocoes")
  let filtro = document.getElementById("filtro").value

  lista.innerHTML = ""

  let p=0,a=0,r=0

  adocoes.sort((a,b)=> new Date(b.data) - new Date(a.data))
  adocoes.forEach((adocao, i)=>{
    if(adocao.status === "pendente") p++
    if(adocao.status === "aprovado") a++
    if(adocao.status === "recusado") r++

    if(filtro !== "todos" && adocao.status !== filtro) return
    if(!adocao.animalNome.toLowerCase().includes(termoBusca)) return

    let cor = "gray"
if(adocao.status === "pendente") cor = "yellow"
else if(adocao.status === "aprovado") cor = "green"
else if(adocao.status === "recusado") cor = "red"
else if(adocao.status === "devolvido") cor = "blue"

    lista.innerHTML += `
<tr class="border-t hover:bg-gray-50">

  <td class="px-4 py-4">
  <span 
    onclick="verAnimal(${adocao.animalId})"
    class="text-teal-600 hover:underline cursor-pointer font-medium"
  >
    ${adocao.animalNome}
  </span>
</td>

  <td class="px-4 py-4 text-left">
    ${adocao.nome}
    
  </td>
  <td class="px-4 py-4">${formatarTelefone(adocao.telefone)}</td>
  <td class="px-4 py-4">
  ${new Date(adocao.data).toLocaleDateString("pt-BR", {
    timeZone: "America/Sao_Paulo"
  })}
</td>

  <td class="px-4 py-4 text-center">
    <span class="bg-${cor}-100 text-${cor}-700 px-3 py-1 rounded-full text-sm inline-flex items-center gap-1">
      ${
        adocao.status === "pendente"
          ? '<i class="fas fa-clock"></i>'
          : adocao.status === "aprovado"
          ? '<i class="fas fa-check"></i>'
          : '<i class="fas fa-times"></i>'
      }
      ${adocao.status.charAt(0).toUpperCase() + adocao.status.slice(1)}
    </span>
  </td>

  <td class="px-4 py-4 text-center space-x-2">
    <button onclick="alterarStatus(${i}, 'aprovado')" class="text-green-600"><i class="fas fa-check"></i></button>
    <button onclick="alterarStatus(${i}, 'recusado')" class="text-red-600"><i class="fas fa-times"></i></button>
    <button onclick="editar(${i})" class="text-blue-500 hover:text-blue-700"><i class="fas fa-pen"></i></button>
    <button onclick="excluir(${i})" class="text-gray-500 hover:text-black"><i class="fas fa-trash"></i></button>
    <button 
  onclick="marcarContato(${i})" 
  title="${adocao.contato ? 'Contato realizado' : 'Marcar como contatado'}"
  class="${adocao.contato ? 'text-green-600 hover:text-green-800' : 'text-gray-400 hover:text-teal-600'}">
  <i class="fas fa-phone"></i>
</button>
  </td>
</tr>`
  })

  document.getElementById("pendentes").innerText = p
  document.getElementById("aprovadas").innerText = a
  document.getElementById("recusadas").innerText = r
}

document.getElementById("filtro").addEventListener("change", render)

let indexEditando = null

function editar(index){
  const adocao = adocoes[index]

  document.getElementById("nome").value = adocao.nome
  document.getElementById("telefone").value = adocao.telefone

  // carrega todos os animais (mesmo os adotados) e seleciona o atual
  carregarAnimaisParaEdicao(index)

  // define o status atual da adoção
  document.getElementById("statusAdocao").value = adocao.status

  indexEditando = index
  abrirModal()
}

let termoBusca = ""

document.getElementById("busca").addEventListener("input", (e)=>{
  termoBusca = e.target.value.toLowerCase()
  render()
})

document.getElementById("telefone").addEventListener("input", function(e){
  let valor = e.target.value.replace(/\D/g, "") // remove tudo que não é número

  if(valor.length > 11) valor = valor.slice(0,11)

  if(valor.length > 10){
    valor = valor.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3")
  } else if(valor.length > 6){
    valor = valor.replace(/(\d{2})(\d{4})(\d+)/, "($1) $2-$3")
  } else if(valor.length > 2){
    valor = valor.replace(/(\d{2})(\d+)/, "($1) $2")
  } else {
    valor = valor.replace(/(\d*)/, "($1")
  }

  e.target.value = valor
})

function formatarTelefone(tel){
  let valor = tel.replace(/\D/g, "")

  if(valor.length === 11){
    return valor.replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3")
  } else if(valor.length === 10){
    return valor.replace(/(\d{2})(\d{4})(\d{4})/, "($1) $2-$3")
  }

  return tel
}

function marcarContato(index){
  adocoes[index].contato = !adocoes[index].contato
  salvar()
  render()
}

function limparFiltro(){
  document.getElementById("filtro").value = "todos"
  document.getElementById("busca").value = ""
  termoBusca = ""
  render()
}


function carregarAnimais(){
  let animais = JSON.parse(localStorage.getItem("animais")) || []
  let select = document.getElementById("animalSelect")

  select.innerHTML = '<option value="">Selecione o animal</option>'

  animais
    .filter(animal => animal.status === "Disponível" || animal.status === "Devolvido")
    .forEach(animal => {
      select.innerHTML += `
        <option value="${animal.id}">
          ${animal.nome} ${animal.status === "Devolvido" ? "(Devolvido)" : ""}
        </option>
      `
    })
}

function verAnimal(animalId){

  let animais = JSON.parse(localStorage.getItem("animais")) || []
  let adocoes = JSON.parse(localStorage.getItem("adocoes")) || []

  let animal = animais.find(a => a.id == animalId)

  if(!animal){
    alert("Animal não encontrado")
    return
  }

  let historico = adocoes.filter(a => a.animalId == animalId)

  let total = historico.length
  let aprovadas = historico.filter(a => a.status === "aprovado").length
  let recusadas = historico.filter(a => a.status === "recusado").length
  let contatos = historico.filter(a => a.contato).length

  document.getElementById("conteudoAnimal").innerHTML = `
    <p><strong>Nome:</strong> ${animal.nome}</p>
    <p><strong>Espécie:</strong> ${animal.especie}</p>
    <p><strong>Raça:</strong> ${animal.raca}</p>
    <p><strong>Idade:</strong> ${animal.idade}</p>

    <hr class="my-3">

    <p><strong>Total de tentativas:</strong> ${total}</p>
    <p><strong>Aprovadas:</strong> ${aprovadas}</p>
    <p><strong>Recusadas:</strong> ${recusadas}</p>
    <p><strong>Contatos realizados:</strong> ${contatos}</p>
  `

  document.getElementById("modalAnimal").classList.remove("hidden")
  document.getElementById("modalAnimal").classList.add("flex")
}

function fecharModalAnimal(){
  document.getElementById("modalAnimal").classList.add("hidden")
}

function carregarAnimaisParaEdicao(index) {
  let animais = JSON.parse(localStorage.getItem("animais")) || []
  let select = document.getElementById("animalSelect")
  select.innerHTML = '<option value="">Selecione o animal</option>'

  animais.forEach(animal => {
    select.innerHTML += `
      <option value="${animal.id}" ${adocoes[index].animalId === animal.id ? 'selected' : ''}>
        ${animal.nome} ${animal.status === "Adotado" ? "(Adotado)" : ""}
      </option>
    `
  })
}

function salvarAdotante(nome, telefone){

  let adotantes = JSON.parse(localStorage.getItem("adotantes")) || []

  // evita duplicado
  let existente = adotantes.find(a => 
    a.nome === nome && a.telefone === telefone
  )

  if(existente){
    return existente.id
  }

  let novo = {
    id: Date.now(),
    nome,
    telefone
  }

  adotantes.push(novo)

  localStorage.setItem("adotantes", JSON.stringify(adotantes))

  return novo.id
}

let acaoConfirmada = null

function abrirConfirmacao(msg, callback){
  const modal = document.getElementById("modalConfirmar")
  const box = modal.querySelector(".modal-box")

  document.getElementById("textoConfirmacao").innerText = msg

  modal.classList.remove("hidden")

  setTimeout(() => {
    box.classList.add("ativo")
  }, 10)

  acaoConfirmada = callback
}

document.getElementById("btnConfirmarAcao").onclick = () => {
  if(acaoConfirmada) acaoConfirmada()
  fecharModalConfirmar()
}

function fecharModalConfirmar(){
  const modal = document.getElementById("modalConfirmar")
  const box = modal.querySelector(".modal-box")

  box.classList.remove("ativo")

  setTimeout(() => {
    modal.classList.add("hidden")
  }, 200)
}

function mostrarSucesso(msg){
  const modal = document.getElementById("modalSucesso")
  const box = modal.querySelector(".modal-box")

  document.getElementById("mensagemSucesso").innerText = msg

  modal.classList.remove("hidden")

  setTimeout(() => {
    box.classList.add("ativo")
  }, 10)
}

function fecharModalSucesso(){
  const modal = document.getElementById("modalSucesso")
  const box = modal.querySelector(".modal-box")

  box.classList.remove("ativo")

  setTimeout(() => {
    modal.classList.add("hidden")
  }, 200)
}

render()
carregarAnimais()

</script>
